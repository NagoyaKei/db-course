<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнования</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1 class="h3">Соревнования</h1>
      <p class="text-secondary mb-0">Список мероприятий клуба</p>
    </div>
    <a th:href="@{/competitions/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card">
    <div class="card-toolbar">
      <div class="search-input">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Поиск по названию или месту"
               aria-label="Поиск" data-table-filter="#competitionsTable" data-table-count="#competitionsCount">
      </div>
      <div class="row-count">Найдено: <span id="competitionsCount" th:text="${#lists.size(competitions)}"></span></div>
    </div>

    <div class="table-responsive">
      <table id="competitionsTable" class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Название</th>
          <th>Дата</th>
          <th>Место</th>
          <th>Трамплин</th>
          <th>Уровень</th>
          <th>Статус</th>
          <th class="text-end">Участников</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${competitions}" data-row>
          <td><a th:href="@{/competitions/{id}(id=${c.id})}" th:text="${c.name}" class="fw-semibold"></a></td>
          <td class="text-nowrap" th:text="${#temporals.format(c.competitionDate, 'dd.MM.yyyy')}"></td>
          <td th:text="${c.location}"></td>
          <td><code th:if="${c.hillName}" th:text="${c.hillName}"></code></td>
          <td><span th:replace="~{fragments/ui :: competitionLevel(${c.level})}"></span></td>
          <td><span th:replace="~{fragments/ui :: competitionStatus(${c.status})}"></span></td>
          <td class="num"
              th:text="${c.participantsCount} + (${c.maxParticipants} != null ? ' / ' + ${c.maxParticipants} : '')"></td>
          <td>
            <div class="row-actions">
              <a th:href="@{/competitions/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary icon-btn"
                 data-bs-toggle="tooltip" data-bs-title="Редактировать" aria-label="Редактировать">
                <i class="bi bi-pencil"></i>
              </a>
              <form th:action="@{/competitions/{id}/delete(id=${c.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-danger icon-btn" data-confirm="Удалить соревнование?"
                        data-bs-toggle="tooltip" data-bs-title="Удалить" aria-label="Удалить">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
        <th:block th:if="${#lists.isEmpty(competitions)}"><tr th:replace="~{fragments/ui :: emptyRow(8, 'bi-trophy', 'Соревнования не найдены')}"></tr></th:block>
        <tr th:unless="${#lists.isEmpty(competitions)}" data-filter-empty hidden>
          <td colspan="8"><div class="empty-state"><i class="bi bi-search"></i><div>Ничего не найдено</div></div></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
