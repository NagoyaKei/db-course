<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнования</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h3">Соревнования</h1>
      <p class="text-muted mb-0">Список мероприятий клуба</p>
    </div>
    <a th:href="@{/competitions/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>Название</th>
          <th>Дата</th>
          <th>Место</th>
          <th>Уровень</th>
          <th>Участников</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${competitions}">
          <td>
            <a th:href="@{/competitions/{id}(id=${c.competitionId})}"
               th:text="${c.name}" class="text-decoration-none fw-medium"></a>
          </td>
          <td th:text="${#temporals.format(c.competitionDate, 'dd.MM.yyyy')}"></td>
          <td th:text="${c.location}"></td>
          <td>
                        <span th:switch="${c.level}">
                            <span th:case="'LOCAL'"         class="badge bg-secondary">Местный</span>
                            <span th:case="'REGIONAL'"      class="badge bg-primary">Региональный</span>
                            <span th:case="'NATIONAL'"      class="badge bg-warning text-dark">Национальный</span>
                            <span th:case="'INTERNATIONAL'" class="badge bg-danger">Международный</span>
                        </span>
          </td>
          <td th:text="${c.participantsCount} + ' / ' + ${c.maxParticipants}"></td>
          <td class="text-end d-flex gap-1 justify-content-end">
            <a th:href="@{/competitions/{id}/edit(id=${c.competitionId})}"
               class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-pencil"></i>
            </a>
            <form th:action="@{/competitions/{id}/delete(id=${c.competitionId})}" method="post">
              <button class="btn btn-sm btn-outline-danger"
                      onclick="return confirm('Удалить соревнование?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(competitions)}">
          <td colspan="6" class="text-center text-muted py-4">Соревнования не найдены</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
