<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнование</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${competition.id == null} ? 'Новое соревнование' : 'Редактирование соревнования'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${competition.id == null} ? @{/competitions} : @{/competitions/{id}/edit(id=${competition.id})}"
        th:object="${competition}" method="post" class="form-card">

    <div class="card mb-4">
      <div class="card-body">
        <div class="section-title">Основное</div>
        <div class="row g-3">
          <div class="col-12" th:insert="~{fragments/form :: textField('name', 'Название', true, 'text', null, null)}"></div>
          <div class="col-md-4" th:insert="~{fragments/form :: dateField('competitionDate', 'Дата', true)}"></div>
          <div class="col-md-4" th:insert="~{fragments/form :: enumField('level', 'Уровень', true, ${enums.competitionLevel})}"></div>
          <div class="col-md-4" th:insert="~{fragments/form :: enumField('status', 'Статус', true, ${enums.competitionStatus})}"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="section-title">Место проведения</div>
        <div class="row g-3">
          <div class="col-12" th:insert="~{fragments/form :: textField('location', 'Город и объект', false, 'text', 'Пермь, трамплин К-90', null)}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: entityField('hillId', 'Трамплин', false, ${hills}, 'id', 'name', '- не указан -')}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: textField('maxParticipants', 'Максимум участников', false, 'number', null, null)}"></div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/competitions}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
