<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнование</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${competition.id == null} ? 'Новое соревнование' : 'Редактирование соревнования'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${competition.id == null} ? @{/competitions} : @{/competitions/{id}/edit(id=${competition.id})}"
        th:object="${competition}" method="post" class="form-card">

    <div class="card mb-4">
      <div class="card-body">
        <div class="section-title">Основное</div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="name">Название <span class="required">*</span></label>
            <input th:field="*{name}" type="text" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="competitionDate">Дата <span class="required">*</span></label>
            <input type="date" id="competitionDate" name="competitionDate" class="form-control"
                   th:value="${#temporals.format(competition.competitionDate, 'yyyy-MM-dd')}"
                   th:classappend="${#fields.hasErrors('competitionDate')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{competitionDate}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="level">Уровень <span class="required">*</span></label>
            <select th:field="*{level}" class="form-select">
              <option value="LOCAL">Местный</option>
              <option value="REGIONAL">Региональный</option>
              <option value="NATIONAL">Национальный</option>
              <option value="INTERNATIONAL">Международный</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="status">Статус <span class="required">*</span></label>
            <select th:field="*{status}" class="form-select">
              <option value="PLANNED">Запланировано</option>
              <option value="ACTIVE">Идет</option>
              <option value="FINISHED">Завершено</option>
              <option value="CANCELLED">Отменено</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="section-title">Место проведения</div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="location">Город и объект</label>
            <input th:field="*{location}" type="text" class="form-control" placeholder="Пермь, трамплин К-90">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="hillId">Трамплин</label>
            <select th:field="*{hillId}" class="form-select">
              <option value="">- не указан -</option>
              <option th:each="h : ${hills}" th:value="${h.id}" th:text="${h.name}"></option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="maxParticipants">Максимум участников</label>
            <input th:field="*{maxParticipants}" type="number" class="form-control" min="1">
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/competitions}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
