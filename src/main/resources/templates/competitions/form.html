<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнование</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${competition.competitionId == null} ? 'Новое соревнование' : 'Редактирование'"></h1>
  </div>

  <div class="card border-0 shadow-sm" style="max-width: 580px;">
    <div class="card-body">
      <form th:action="${competition.competitionId == null} ? @{/competitions} : @{/competitions/{id}/edit(id=${competition.competitionId})}"
            th:object="${competition}" method="post">

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Название <span class="text-danger">*</span></label>
            <input th:field="*{name}" type="text" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Дата <span class="text-danger">*</span></label>
            <input th:field="*{competitionDate}" type="date" class="form-control"
                   th:classappend="${#fields.hasErrors('competitionDate')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{competitionDate}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Уровень <span class="text-danger">*</span></label>
            <select th:field="*{level}" class="form-select">
              <option value="LOCAL">Местный</option>
              <option value="REGIONAL">Региональный</option>
              <option value="NATIONAL">Национальный</option>
              <option value="INTERNATIONAL">Международный</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Место проведения</label>
            <input th:field="*{location}" type="text" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Макс. участников</label>
            <input th:field="*{maxParticipants}" type="number" class="form-control" min="1">
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Сохранить
          </button>
          <a th:href="@{/competitions}" class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
