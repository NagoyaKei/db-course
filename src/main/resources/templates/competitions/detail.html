<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Соревнование</title></head>
<body>
<div layout:fragment="content">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/competitions}">Соревнования</a></li>
      <li class="breadcrumb-item active" aria-current="page" th:text="${competition.name}"></li>
    </ol>
  </nav>

  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="profile-title">
        <h1 class="h2" th:text="${competition.name}"></h1>
        <span th:replace="~{fragments/ui :: competitionLevel(${competition.level})}"></span>
        <span th:replace="~{fragments/ui :: competitionStatus(${competition.status})}"></span>
      </div>

      <div class="facts mb-4">
        <div>
          <div class="fact-label">Дата</div>
          <div class="fact-value" th:text="${#temporals.format(competition.competitionDate, 'dd.MM.yyyy')}"></div>
        </div>
        <div>
          <div class="fact-label">Место</div>
          <div class="fact-value" th:text="${competition.location != null} ? ${competition.location} : '-'"></div>
        </div>
        <div>
          <div class="fact-label">Трамплин</div>
          <div class="fact-value" th:text="${competition.hillName != null} ? ${competition.hillName} : '-'"></div>
        </div>
        <div>
          <div class="fact-label">Участников</div>
          <div class="fact-value"
               th:text="${competition.participantsCount} + (${competition.maxParticipants} != null ? ' из ' + ${competition.maxParticipants} : '')"></div>
        </div>
      </div>

      <a th:href="@{/competitions/{id}/edit(id=${competition.id})}" class="btn btn-outline-secondary">
        <i class="bi bi-pencil me-1"></i> Редактировать
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Протокол результатов</span>
      <span class="badge-soft is-secondary" th:text="${#lists.size(results)}"></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th>#</th>
          <th>Спортсмен</th>
          <th class="text-end">Дистанция, м</th>
          <th class="text-end">Стиль</th>
          <th class="text-end">Ветер</th>
          <th class="text-end">Очки</th>
          <th class="text-end">Попытка</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r, stat : ${results}">
          <td class="num" th:text="${stat.index + 1}"></td>
          <td><a th:href="@{/athletes/{id}(id=${r.athleteId})}" th:text="${r.athleteFullName}" class="fw-semibold"></a></td>
          <td class="num num-strong" th:text="${r.distance}"></td>
          <td class="num" th:text="${r.stylePoints}"></td>
          <td class="num" th:text="${r.windFactor}"></td>
          <td class="num" th:text="${r.points}"></td>
          <td class="num" th:text="${r.attemptNumber}"></td>
        </tr>
        <th:block th:if="${#lists.isEmpty(results)}"><tr th:replace="~{fragments/ui :: emptyRow(7, 'bi-graph-up', 'Результаты не зарегистрированы')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
