<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Спортсмен</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${athlete.personId == null} ? 'Новый спортсмен' : 'Редактирование'"></h1>
  </div>

  <div class="card border-0 shadow-sm" style="max-width: 640px;">
    <div class="card-body">
      <form th:action="${athlete.personId == null} ? @{/athletes} : @{/athletes/{id}/edit(id=${athlete.personId})}"
            th:object="${athlete}" method="post">

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Фамилия <span class="text-danger">*</span></label>
            <input th:field="*{lastName}" type="text" class="form-control"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{lastName}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Имя <span class="text-danger">*</span></label>
            <input th:field="*{firstName}" type="text" class="form-control"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{firstName}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Отчество</label>
            <input th:field="*{middleName}" type="text" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Дата рождения <span class="text-danger">*</span></label>
            <input type="date"
                   id="birthDate"
                   name="birthDate"
                   class="form-control"
                   th:value="${#temporals.format(birthDate, 'dd.MM.yyyy')}"
                   th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{birthDate}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Пол <span class="text-danger">*</span></label>
            <select th:field="*{gender}" class="form-select">
              <option value="M">Мужской</option>
              <option value="F">Женский</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Контакт</label>
            <input th:field="*{contactInfo}" type="text" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Тренер <span class="text-danger">*</span></label>
            <select th:field="*{coachId}" class="form-select"
                    th:classappend="${#fields.hasErrors('coachId')} ? 'is-invalid'">
              <option value="">- выберите -</option>
              <option th:each="c : ${coaches}"
                      th:value="${c.personId}"
                      th:text="${c.fullName}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{coachId}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Номер спортсмена <span class="text-danger">*</span></label>
            <input th:field="*{athleteNumber}" type="text" class="form-control"
                   placeholder="ATH-2025-001"
                   th:classappend="${#fields.hasErrors('athleteNumber')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{athleteNumber}"></div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Год начала <span class="text-danger">*</span></label>
            <input th:field="*{startYear}" type="number" class="form-control"
                   min="2000" th:classappend="${#fields.hasErrors('startYear')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{startYear}"></div>
          </div>
<!--          <div class="col-md-6">-->
<!--            <label class="form-label">Разряд</label>-->
<!--            <select th:field="*{currentRankId}" class="form-select">-->
<!--              <option value="">- не присвоен -</option>-->
<!--              <option th:each="r : ${ranks}"-->
<!--                      th:value="${r.rankId}"-->
<!--                      th:text="${r.rankName}"></option>-->
<!--            </select>-->
<!--          </div>-->

          <div class="col-md-6">
            <label class="form-label">Статус</label>
            <select th:field="*{currentStatus}" class="form-select">
              <option value="ACTIVE">Активен</option>
              <option value="INACTIVE">Травмирован</option>
              <option value="SUSPENDED">На пенсии</option>
            </select>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Сохранить
          </button>
          <a th:href="@{/athletes}" class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
