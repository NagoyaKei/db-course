<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Спортсмен</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${athlete.personId == null} ? 'Новый спортсмен' : 'Редактирование спортсмена'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${athlete.personId == null} ? @{/athletes} : @{/athletes/{id}/edit(id=${athlete.personId})}"
        th:object="${athlete}" method="post" enctype="multipart/form-data" class="form-card">
    <div class="row g-4">

      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="section-title">Фото</div>
            <div th:replace="~{fragments/photo :: upload(${athlete})}"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body">
            <div class="section-title">Личные данные</div>
            <div class="row g-3">
              <th:block th:replace="~{fragments/person :: fields}"></th:block>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="section-title">Спортивные данные</div>
            <div class="row g-3">
              <div class="col-md-6" th:insert="~{fragments/form :: entityField('coachId', 'Тренер', false, ${coaches}, 'personId', 'fullName', '- без тренера -')}"></div>
              <div class="col-md-6" th:insert="~{fragments/form :: textField('athleteNumber', 'Номер спортсмена', true, 'text', 'ATH-2025-001', null)}"></div>
              <div class="col-md-6" th:insert="~{fragments/form :: textField('startYear', 'Год начала занятий', true, 'number', null, null)}"></div>
              <div class="col-md-6" th:insert="~{fragments/form :: enumField('currentStatus', 'Статус', true, ${enums.athleteStatus})}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/athletes}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
