<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Спортсмен</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h3" th:text="${athlete.fullName}"></h1>
      <p class="text-muted mb-0" th:text="'Номер: ' + ${athlete.athleteNumber}"></p>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/athletes/{id}/edit(id=${athlete.personId})}"
         class="btn btn-outline-secondary">
        <i class="bi bi-pencil me-1"></i> Редактировать
      </a>
      <form th:action="@{/athletes/{id}/deactivate(id=${athlete.personId})}" method="post">
        <button class="btn btn-outline-danger"
                onclick="return confirm('Деактивировать спортсмена?')">
          <i class="bi bi-person-x me-1"></i> Деактивировать
        </button>
      </form>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent fw-medium">Основные данные</div>
        <div class="card-body">
          <div class="d-flex flex-wrap gap-4">
          <div th:replace="~{fragments/photo :: view(${athlete})}"></div>
          <dl class="row mb-0 align-content-start" style="flex: 1; min-width: 260px;">
            <dt class="col-5 text-muted">Дата рождения</dt>
            <dd class="col-7" th:text="${#temporals.format(athlete.birthDate, 'dd.MM.yyyy')}"></dd>
            <dt class="col-5 text-muted">Тренер</dt>
            <dd class="col-7" th:text="${athlete.coachFullName}"></dd>
            <dt class="col-5 text-muted">Год начала</dt>
            <dd class="col-7" th:text="${athlete.startYear}"></dd>
            <dt class="col-5 text-muted">Разряд</dt>
            <dd class="col-7">
                            <span th:if="${athlete.rankName}"
                                  class="badge bg-info text-dark"
                                  th:text="${athlete.rankName}"></span>
              <span th:unless="${athlete.rankName}" class="text-muted">не присвоен</span>
            </dd>
            <dt class="col-5 text-muted">Статус</dt>
            <dd class="col-7">
                            <span th:switch="${athlete.currentStatus}">
                                <span th:case="'ACTIVE'"    class="badge bg-success">Активен</span>
                                <span th:case="'INACTIVE'"  class="badge bg-secondary">Неактивен</span>
                                <span th:case="'SUSPENDED'" class="badge bg-danger">Дисквалифицирован</span>
                            </span>
            </dd>
          </dl>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/athletes}" class="btn btn-link text-decoration-none px-0">
      <i class="bi bi-arrow-left me-1"></i> Назад к списку
    </a>
  </div>

</div>
</body>
</html>
