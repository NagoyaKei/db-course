<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Спортсмен</title></head>
<body>
<div layout:fragment="content">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/athletes}">Спортсмены</a></li>
      <li class="breadcrumb-item active" aria-current="page" th:text="${athlete.fullName}"></li>
    </ol>
  </nav>

  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="profile">
        <div th:replace="~{fragments/photo :: view(${athlete})}"></div>
        <div>
          <div class="profile-title">
            <h1 class="h2" th:text="${athlete.fullName}"></h1>
            <span th:replace="~{fragments/ui :: badge(${athlete.currentStatus})}"></span>
            <span th:replace="~{fragments/ui :: rank(${athlete.rankName})}"></span>
          </div>

          <div class="facts mb-4">
            <div>
              <div class="fact-label">Номер</div>
              <div class="fact-value"><code th:text="${athlete.athleteNumber}"></code></div>
            </div>
            <div>
              <div class="fact-label">Дата рождения</div>
              <div class="fact-value" th:text="${#temporals.format(athlete.birthDate, 'dd.MM.yyyy')}"></div>
            </div>
            <div>
              <div class="fact-label">Пол</div>
              <div class="fact-value" th:text="${athlete.gender?.label}"></div>
            </div>
            <div>
              <div class="fact-label">Год начала занятий</div>
              <div class="fact-value" th:text="${athlete.startYear}"></div>
            </div>
            <div>
              <div class="fact-label">Тренер</div>
              <div class="fact-value">
                <a th:if="${athlete.coachId != null and athlete.coachId != 0}"
                   th:href="@{/coaches/{id}(id=${athlete.coachId})}" th:text="${athlete.coachFullName}"></a>
                <span th:unless="${athlete.coachId != null and athlete.coachId != 0}" class="text-secondary">нет</span>
              </div>
            </div>
            <div th:if="${athlete.contactInfo}">
              <div class="fact-label">Контакт</div>
              <div class="fact-value" th:text="${athlete.contactInfo}"></div>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/athletes/{id}/edit(id=${athlete.personId})}" class="btn btn-outline-secondary">
              <i class="bi bi-pencil me-1"></i> Редактировать
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-4" th:if="${chart != null}">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Динамика результатов</span>
      <span th:if="${forecast != null}" class="text-secondary small">
        Прогноз через <span th:text="${horizonDays}"></span> дн.:
        <span class="fw-semibold" th:text="${forecast.forecastDistance} + ' м'"></span>,
        тренд <span th:text="${forecast.trendPerYear} + ' м/год'"></span>,
        прыжков <span th:text="${forecast.jumpsUsed}"></span>, R&sup2; <span th:text="${forecast.rSquared}"></span>
      </span>
    </div>
    <div class="card-body">
      <div class="chart-box">
        <canvas data-chart th:attr="data-chart=${chart}" role="img" aria-label="Динамика результатов и прогноз"></canvas>
      </div>
    </div>
    <div th:replace="~{fragments/legend :: forecast}"></div>
  </div>

  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Физиологические замеры</span>
      <span class="badge-soft is-secondary" th:text="${#lists.size(measures)}"></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Дата</th>
          <th class="text-end">Рост, см</th>
          <th class="text-end">Вес, кг</th>
          <th class="text-end">VO2 max</th>
          <th class="text-end">Пульс покоя</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${measures}">
          <td class="text-nowrap" th:text="${#temporals.format(m.measureDate, 'dd.MM.yyyy')}"></td>
          <td class="num" th:text="${m.height}"></td>
          <td class="num" th:text="${m.weight}"></td>
          <td class="num" th:text="${m.vo2Max}"></td>
          <td class="num" th:text="${m.restingHr}"></td>
        </tr>
        <th:block th:if="${#lists.isEmpty(measures)}"><tr th:replace="~{fragments/ui :: emptyRow(5, 'bi-heart-pulse', 'Замеров пока нет')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Результаты прыжков</span>
      <span class="badge-soft is-secondary" th:text="${#lists.size(jumps)}"></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Дата</th>
          <th>Соревнование</th>
          <th>Трамплин</th>
          <th class="text-end">Дистанция, м</th>
          <th class="text-end">Очки</th>
          <th class="text-end">Попытка</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="j : ${jumps}">
          <td class="text-nowrap" th:text="${#temporals.format(j.jumpTimestamp, 'dd.MM.yyyy')}"></td>
          <td><a th:href="@{/competitions/{id}(id=${j.competitionId})}" th:text="${j.competitionName}"></a></td>
          <td><code th:if="${j.hillType}" th:text="${j.hillType}"></code></td>
          <td class="num num-strong" th:text="${j.distance}"></td>
          <td class="num" th:text="${j.points}"></td>
          <td class="num" th:text="${j.attemptNumber}"></td>
        </tr>
        <th:block th:if="${#lists.isEmpty(jumps)}"><tr th:replace="~{fragments/ui :: emptyRow(6, 'bi-graph-up', 'Прыжков пока нет')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

  <th:block layout:fragment="scripts">
    <script th:src="@{/vendor/chartjs/chart.umd.js}"></script>
    <script th:src="@{/js/charts.js}"></script>
  </th:block>

</div>
</body>
</html>
