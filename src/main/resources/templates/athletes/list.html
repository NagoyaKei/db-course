<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Спортсмены</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1 class="h3">Спортсмены</h1>
      <p class="text-secondary mb-0">Реестр спортсменов клуба</p>
    </div>
    <a th:href="@{/athletes/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card">
    <form method="get" class="card-toolbar">
      <div class="search-input">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Поиск по имени, номеру, тренеру"
               aria-label="Поиск" data-table-filter="#athletesTable" data-table-count="#athletesCount">
      </div>
      <select name="status" class="form-select w-auto" aria-label="Статус" onchange="this.form.submit()">
        <option value="" th:selected="${selectedStatus == null}">Все статусы</option>
        <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Активен</option>
        <option value="INACTIVE" th:selected="${selectedStatus == 'INACTIVE'}">Неактивен</option>
        <option value="SUSPENDED" th:selected="${selectedStatus == 'SUSPENDED'}">Дисквалифицирован</option>
      </select>
      <div class="row-count">Найдено: <span id="athletesCount" th:text="${#lists.size(athletes)}"></span></div>
    </form>

    <div class="table-responsive">
      <table id="athletesTable" class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Спортсмен</th>
          <th>Номер</th>
          <th>Тренер</th>
          <th>Разряд</th>
          <th>Статус</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${athletes}" data-row>
          <td>
            <div class="cell-person">
              <div th:replace="~{fragments/photo :: thumbnail(${a})}"></div>
              <div>
                <a th:href="@{/athletes/{id}(id=${a.personId})}" th:text="${a.fullName}" class="name"></a>
                <div class="cell-sub" th:text="${#temporals.format(a.birthDate, 'dd.MM.yyyy')}"></div>
              </div>
            </div>
          </td>
          <td><code th:text="${a.athleteNumber}"></code></td>
          <td th:text="${a.coachFullName}"></td>
          <td><span th:replace="~{fragments/ui :: rank(${a.rankName})}"></span></td>
          <td><span th:replace="~{fragments/ui :: athleteStatus(${a.currentStatus})}"></span></td>
          <td>
            <div class="row-actions">
              <a th:href="@{/athletes/{id}/edit(id=${a.personId})}" class="btn btn-sm btn-outline-secondary icon-btn"
                 data-bs-toggle="tooltip" data-bs-title="Редактировать" aria-label="Редактировать">
                <i class="bi bi-pencil"></i>
              </a>
            </div>
          </td>
        </tr>
        <th:block th:if="${#lists.isEmpty(athletes)}"><tr th:replace="~{fragments/ui :: emptyRow(6, 'bi-people', 'Спортсмены не найдены')}"></tr></th:block>
        <tr th:unless="${#lists.isEmpty(athletes)}" data-filter-empty hidden>
          <td colspan="6"><div class="empty-state"><i class="bi bi-search"></i><div>Ничего не найдено</div></div></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
