<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренеры</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1 class="h3">Тренеры</h1>
      <p class="text-secondary mb-0">Тренерский состав клуба</p>
    </div>
    <a th:href="@{/coaches/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card">
    <div class="card-toolbar">
      <div class="search-input">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Поиск по имени или лицензии"
               aria-label="Поиск" data-table-filter="#coachesTable" data-table-count="#coachesCount">
      </div>
      <div class="row-count">Найдено: <span id="coachesCount" th:text="${#lists.size(coaches)}"></span></div>
    </div>

    <div class="table-responsive">
      <table id="coachesTable" class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Тренер</th>
          <th>Лицензия</th>
          <th>Разряд</th>
          <th class="text-end">Стаж, лет</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${coaches}" data-row>
          <td>
            <div class="cell-person">
              <div th:replace="~{fragments/photo :: thumbnail(${c})}"></div>
              <a th:href="@{/coaches/{id}(id=${c.personId})}" th:text="${c.fullName}" class="name"></a>
            </div>
          </td>
          <td><code th:text="${c.licenseNumber}"></code></td>
          <td><span th:replace="~{fragments/ui :: rank(${c.rankName})}"></span></td>
          <td class="num" th:text="${c.experienceYears}"></td>
          <td>
            <div class="row-actions">
              <a th:href="@{/coaches/{id}/edit(id=${c.personId})}" class="btn btn-sm btn-outline-secondary icon-btn"
                 data-bs-toggle="tooltip" data-bs-title="Редактировать" aria-label="Редактировать">
                <i class="bi bi-pencil"></i>
              </a>
            </div>
          </td>
        </tr>
        <th:block th:if="${#lists.isEmpty(coaches)}"><tr th:replace="~{fragments/ui :: emptyRow(5, 'bi-person-badge', 'Тренеры не найдены')}"></tr></th:block>
        <tr th:unless="${#lists.isEmpty(coaches)}" data-filter-empty hidden>
          <td colspan="5"><div class="empty-state"><i class="bi bi-search"></i><div>Ничего не найдено</div></div></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
