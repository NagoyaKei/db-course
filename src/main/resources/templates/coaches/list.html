<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренеры</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h3">Тренеры</h1>
      <p class="text-muted mb-0">Тренерский состав клуба</p>
    </div>
    <a th:href="@{/coaches/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>Тренер</th>
          <th>Лицензия</th>
          <th>Специализация</th>
          <th>Стаж (лет)</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${coaches}">
          <td>
            <a th:href="@{/coaches/{id}(id=${c.personId})}"
               th:text="${c.fullName}" class="text-decoration-none fw-medium"></a>
          </td>
          <td><code th:text="${c.licenseNumber}"></code></td>
          <td th:text="${c.specialization}"></td>
          <td th:text="${c.experienceYears}"></td>
          <td class="text-end">
            <a th:href="@{/coaches/{id}/edit(id=${c.personId})}"
               class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-pencil"></i>
            </a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(coaches)}">
          <td colspan="5" class="text-center text-muted py-4">Тренеры не найдены</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
