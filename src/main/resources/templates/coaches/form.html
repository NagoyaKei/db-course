<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренер</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${coach.personId == null} ? 'Новый тренер' : 'Редактирование тренера'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${coach.personId == null} ? @{/coaches} : @{/coaches/{id}/edit(id=${coach.personId})}"
        th:object="${coach}" method="post" enctype="multipart/form-data" class="form-card">
    <div class="row g-4">

      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="section-title">Фото</div>
            <div th:replace="~{fragments/photo :: upload(${coach})}"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body">
            <div class="section-title">Личные данные</div>
            <div class="row g-3">
              <th:block th:replace="~{fragments/person :: fields}"></th:block>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="section-title">Квалификация</div>
            <div class="row g-3">
              <div class="col-md-8" th:insert="~{fragments/form :: textField('licenseNumber', 'Номер лицензии', true, 'text', 'LIC-2025-001', null)}"></div>
              <div class="col-md-4" th:insert="~{fragments/form :: textField('experienceYears', 'Стаж, лет', true, 'number', null, null)}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/coaches}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
