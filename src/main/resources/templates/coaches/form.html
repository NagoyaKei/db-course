<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренер</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${coach.personId == null} ? 'Новый тренер' : 'Редактирование тренера'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${coach.personId == null} ? @{/coaches} : @{/coaches/{id}/edit(id=${coach.personId})}"
        th:object="${coach}" method="post" enctype="multipart/form-data" class="form-card">
    <div class="row g-4">

      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="section-title">Фото</div>
            <div th:replace="~{fragments/photo :: input(${coach})}"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body">
            <div class="section-title">Личные данные</div>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" for="lastName">Фамилия <span class="required">*</span></label>
                <input th:field="*{lastName}" type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{lastName}"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="firstName">Имя <span class="required">*</span></label>
                <input th:field="*{firstName}" type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{firstName}"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="middleName">Отчество</label>
                <input th:field="*{middleName}" type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="birthDate">Дата рождения <span class="required">*</span></label>
                <input type="date" id="birthDate" name="birthDate" class="form-control"
                       th:value="${#temporals.format(coach.birthDate, 'yyyy-MM-dd')}"
                       th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{birthDate}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="gender">Пол <span class="required">*</span></label>
                <select th:field="*{gender}" class="form-select">
                  <option value="M">Мужской</option>
                  <option value="F">Женский</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="contactInfo">Контакт</label>
                <input th:field="*{contactInfo}" type="text" class="form-control" placeholder="Почта или телефон">
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="section-title">Квалификация</div>
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="licenseNumber">Номер лицензии <span class="required">*</span></label>
                <input th:field="*{licenseNumber}" type="text" class="form-control" placeholder="LIC-2025-001"
                       th:classappend="${#fields.hasErrors('licenseNumber')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{licenseNumber}"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="experienceYears">Стаж, лет</label>
                <input th:field="*{experienceYears}" type="number" class="form-control" min="0" max="80">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/coaches}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
