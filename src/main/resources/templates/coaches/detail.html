<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренер</title></head>
<body>
<div layout:fragment="content">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/coaches}">Тренеры</a></li>
      <li class="breadcrumb-item active" aria-current="page" th:text="${coach.fullName}"></li>
    </ol>
  </nav>

  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="profile">
        <div th:replace="~{fragments/photo :: view(${coach})}"></div>
        <div>
          <div class="profile-title">
            <h1 class="h2" th:text="${coach.fullName}"></h1>
          </div>

          <div class="facts mb-4">
            <div>
              <div class="fact-label">Лицензия</div>
              <div class="fact-value"><code th:text="${coach.licenseNumber}"></code></div>
            </div>
            <div>
              <div class="fact-label">Стаж</div>
              <div class="fact-value" th:text="${coach.experienceYears} + ' лет'"></div>
            </div>
            <div>
              <div class="fact-label">Дата рождения</div>
              <div class="fact-value" th:text="${#temporals.format(coach.birthDate, 'dd.MM.yyyy')}"></div>
            </div>
            <div>
              <div class="fact-label">Спортсменов</div>
              <div class="fact-value" th:text="${#lists.size(athletes)}"></div>
            </div>
            <div th:if="${coach.contactInfo}">
              <div class="fact-label">Контакт</div>
              <div class="fact-value" th:text="${coach.contactInfo}"></div>
            </div>
          </div>

          <a th:href="@{/coaches/{id}/edit(id=${coach.personId})}" class="btn btn-outline-secondary">
            <i class="bi bi-pencil me-1"></i> Редактировать
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Спортсмены тренера</span>
      <span class="badge-soft is-secondary" th:text="${#lists.size(athletes)}"></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Спортсмен</th>
          <th>Номер</th>
          <th>Разряд</th>
          <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${athletes}">
          <td>
            <div class="cell-person">
              <div th:replace="~{fragments/photo :: thumbnail(${a})}"></div>
              <a th:href="@{/athletes/{id}(id=${a.personId})}" th:text="${a.fullName}" class="name"></a>
            </div>
          </td>
          <td><code th:text="${a.athleteNumber}"></code></td>
          <td><span th:replace="~{fragments/ui :: rank(${a.rankName})}"></span></td>
          <td><span th:replace="~{fragments/ui :: badge(${a.currentStatus})}"></span></td>
        </tr>
        <th:block th:if="${#lists.isEmpty(athletes)}"><tr th:replace="~{fragments/ui :: emptyRow(4, 'bi-people', 'У тренера нет спортсменов')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
