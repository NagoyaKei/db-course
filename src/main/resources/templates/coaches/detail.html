<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Тренер</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <h1 class="h3" th:text="${coach.fullName}"></h1>
    <a th:href="@{/coaches/{id}/edit(id=${coach.personId})}"
       class="btn btn-outline-secondary">
      <i class="bi bi-pencil me-1"></i> Редактировать
    </a>
  </div>

  <div class="row g-4">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent fw-medium">Данные тренера</div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-6 text-muted">Лицензия</dt>
            <dd class="col-6"><code th:text="${coach.licenseNumber}"></code></dd>
            <dt class="col-6 text-muted">Специализация</dt>
            <dd class="col-6" th:text="${coach.specialization}"></dd>
            <dt class="col-6 text-muted">Стаж</dt>
            <dd class="col-6" th:text="${coach.experienceYears} + ' лет'"></dd>
          </dl>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent fw-medium">
          Спортсмены (<span th:text="${#lists.size(athletes)}"></span>)
        </div>
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead class="table-light">
            <tr>
              <th>Спортсмен</th>
              <th>Номер</th>
              <th>Статус</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${athletes}">
              <td>
                <a th:href="@{/athletes/{id}(id=${a.personId})}"
                   th:text="${a.fullName}" class="text-decoration-none"></a>
              </td>
              <td><code th:text="${a.athleteNumber}"></code></td>
              <td>
                                <span th:switch="${a.currentStatus}">
                                    <span th:case="'ACTIVE'"   class="badge bg-success">Активен</span>
                                    <span th:case="'INACTIVE'" class="badge bg-secondary">Неактивен</span>
                                    <span th:case="*"          class="badge bg-danger">Дисквалифицирован</span>
                                </span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(athletes)}">
              <td colspan="3" class="text-muted text-center py-3">Нет спортсменов</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/coaches}" class="btn btn-link text-decoration-none px-0">
      <i class="bi bi-arrow-left me-1"></i> Назад к списку
    </a>
  </div>

</div>
</body>
</html>
