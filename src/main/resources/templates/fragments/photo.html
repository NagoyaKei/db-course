<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<div th:fragment="view(person)">
  <img th:if="${person.hasPhoto}" th:src="@{/persons/{id}/photo(id=${person.personId})}"
       th:alt="${person.fullName}" class="avatar avatar-lg">
  <div th:unless="${person.hasPhoto}" class="avatar avatar-lg avatar-placeholder" aria-hidden="true">
    <i class="bi bi-person"></i>
  </div>
</div>

<div th:fragment="thumbnail(person)">
  <img th:if="${person.hasPhoto}" th:src="@{/persons/{id}/photo/thumbnail(id=${person.personId})}"
       th:alt="${person.fullName}" class="avatar avatar-sm" loading="lazy">
  <div th:unless="${person.hasPhoto}" class="avatar avatar-sm avatar-placeholder" aria-hidden="true">
    <i class="bi bi-person"></i>
  </div>
</div>

<div th:fragment="input(person)">
  <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-3">
    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
  </div>
  <label class="dropzone" for="photoInput">
    <img data-photo-preview alt="Предпросмотр фото" class="dropzone-preview"
         th:classappend="${person.personId == null or !person.hasPhoto} ? 'd-none'"
         th:src="${person.personId != null and person.hasPhoto} ? @{/persons/{id}/photo(id=${person.personId})}">
    <i class="bi bi-cloud-arrow-up" data-photo-icon th:classappend="${person.personId != null and person.hasPhoto} ? 'd-none'"></i>
    <span class="fw-medium">Перетащите фото или нажмите</span>
    <span class="small">JPEG, PNG или WebP, до 2 МБ</span>
    <input id="photoInput" type="file" name="photo" accept="image/jpeg,image/png,image/webp" data-photo-input>
  </label>
  <div th:if="${person.personId != null and person.hasPhoto}" class="form-check mt-3">
    <input class="form-check-input" type="checkbox" name="removePhoto" id="removePhoto" value="true">
    <label class="form-check-label" for="removePhoto">Удалить текущее фото</label>
  </div>
</div>

</body>
</html>
