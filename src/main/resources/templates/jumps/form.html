<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Новый прыжок</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3">Регистрация результата прыжка</h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="@{/jumps}" th:object="${jump}" method="post" class="form-card">

    <div class="card mb-4">
      <div class="card-body">
        <div class="section-title">Кто и где прыгал</div>
        <div class="row g-3">
          <div class="col-md-6" th:insert="~{fragments/form :: entityField('athleteId', 'Спортсмен', true, ${athletes}, 'personId', 'fullName', '- выберите -')}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: entityField('competitionId', 'Соревнование', true, ${competitions}, 'id', 'title', '- выберите -')}"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="section-title">Результат</div>
        <div class="row g-3">
          <div class="col-md-6 col-lg-3" th:insert="~{fragments/form :: textField('distance', 'Дистанция, м', true, 'number', null, '0.01')}"></div>
          <div class="col-md-6 col-lg-3">
            <label class="form-label" for="attemptNumber">Попытка</label>
            <select th:field="*{attemptNumber}" class="form-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>
          <div class="col-md-6 col-lg-3" th:insert="~{fragments/form :: textField('stylePoints', 'Баллы за стиль', false, 'number', null, '0.1')}"></div>
          <div class="col-md-6 col-lg-3" th:insert="~{fragments/form :: textField('windFactor', 'Поправка на ветер', false, 'number', null, '0.01')}"></div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/jumps}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
