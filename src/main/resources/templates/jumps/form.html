<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Новый прыжок</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3">Регистрация результата прыжка</h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="@{/jumps}" th:object="${jump}" method="post" class="form-card">

    <div class="card mb-4">
      <div class="card-body">
        <div class="section-title">Кто и где прыгал</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="athleteId">Спортсмен <span class="required">*</span></label>
            <select th:field="*{athleteId}" class="form-select"
                    th:classappend="${#fields.hasErrors('athleteId')} ? 'is-invalid'">
              <option value="">- выберите -</option>
              <option th:each="a : ${athletes}" th:value="${a.personId}" th:text="${a.fullName}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{athleteId}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="competitionId">Соревнование <span class="required">*</span></label>
            <select th:field="*{competitionId}" class="form-select"
                    th:classappend="${#fields.hasErrors('competitionId')} ? 'is-invalid'">
              <option value="">- выберите -</option>
              <option th:each="c : ${competitions}" th:value="${c.id}"
                      th:text="${c.name} + ' (' + ${#temporals.format(c.competitionDate, 'dd.MM.yyyy')} + ')'"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{competitionId}"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="section-title">Результат</div>
        <div class="row g-3">
          <div class="col-md-6 col-lg-3">
            <label class="form-label" for="distance">Дистанция, м <span class="required">*</span></label>
            <input th:field="*{distance}" type="number" step="0.01" class="form-control" min="0" max="300"
                   th:classappend="${#fields.hasErrors('distance')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{distance}"></div>
          </div>
          <div class="col-md-6 col-lg-3">
            <label class="form-label" for="attemptNumber">Попытка</label>
            <select th:field="*{attemptNumber}" class="form-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>
          <div class="col-md-6 col-lg-3">
            <label class="form-label" for="stylePoints">Баллы за стиль</label>
            <input th:field="*{stylePoints}" type="number" step="0.1" class="form-control" min="0" max="60">
          </div>
          <div class="col-md-6 col-lg-3">
            <label class="form-label" for="windFactor">Поправка на ветер</label>
            <input th:field="*{windFactor}" type="number" step="0.01" class="form-control" min="-5" max="5">
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/jumps}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
