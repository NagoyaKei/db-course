<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Результаты прыжков</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1 class="h3">Результаты прыжков</h1>
      <p class="text-secondary mb-0">Все зарегистрированные прыжки</p>
    </div>
    <a th:href="@{/jumps/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card">
    <div class="card-toolbar">
      <div class="search-input">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Поиск по спортсмену или соревнованию"
               aria-label="Поиск" data-table-filter="#jumpsTable" data-table-count="#jumpsCount">
      </div>
      <div class="row-count">Найдено: <span id="jumpsCount" th:text="${#lists.size(jumps)}"></span></div>
    </div>

    <div class="table-responsive">
      <table id="jumpsTable" class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Дата</th>
          <th>Спортсмен</th>
          <th>Соревнование</th>
          <th>Трамплин</th>
          <th>Категория</th>
          <th class="text-end">Дистанция, м</th>
          <th class="text-end">Очки</th>
          <th class="text-end">Попытка</th>
          <th>Рекорд</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="j : ${jumps}" data-row>
          <td class="text-nowrap" th:text="${#temporals.format(j.jumpTimestamp, 'dd.MM.yyyy')}"></td>
          <td><a th:href="@{/athletes/{id}(id=${j.athleteId})}" th:text="${j.athleteFullName}" class="fw-semibold"></a></td>
          <td><a th:href="@{/competitions/{id}(id=${j.competitionId})}" th:text="${j.competitionName}"></a></td>
          <td><code th:if="${j.hillType}" th:text="${j.hillType}"></code></td>
          <td th:text="${j.ageCategoryName}"></td>
          <td class="num num-strong" th:text="${j.distance}"></td>
          <td class="num" th:text="${j.points}"></td>
          <td class="num" th:text="${j.attemptNumber}"></td>
          <td><span th:replace="~{fragments/ui :: badge(${j.recordType})}"></span></td>
          <td>
            <div class="row-actions">
              <a th:href="@{/jumps/{id}/record(id=${j.jumpId})}" class="btn btn-sm btn-outline-secondary icon-btn"
                 data-bs-toggle="tooltip" data-bs-title="Рекорд" aria-label="Рекорд">
                <i class="bi bi-trophy"></i>
              </a>
              <form th:action="@{/jumps/{id}/delete(id=${j.jumpId})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-danger icon-btn" data-confirm="Удалить результат?"
                        data-bs-toggle="tooltip" data-bs-title="Удалить" aria-label="Удалить">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
        <th:block th:if="${#lists.isEmpty(jumps)}"><tr th:replace="~{fragments/ui :: emptyRow(10, 'bi-graph-up', 'Результаты не найдены')}"></tr></th:block>
        <tr th:unless="${#lists.isEmpty(jumps)}" data-filter-empty hidden>
          <td colspan="10"><div class="empty-state"><i class="bi bi-search"></i><div>Ничего не найдено</div></div></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
