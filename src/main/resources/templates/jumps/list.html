<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Результаты прыжков</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h3">Результаты прыжков</h1>
      <p class="text-muted mb-0">Все зарегистрированные прыжки</p>
    </div>
    <a th:href="@{/jumps/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>Спортсмен</th>
          <th>Соревнование</th>
          <th>Дистанция (м)</th>
          <th>Стиль</th>
          <th>Ветер</th>
          <th>Попытка</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="j : ${jumps}">
          <td>
            <a th:href="@{/athletes/{id}(id=${j.personId})}"
               th:text="${j.athleteFullName}" class="text-decoration-none"></a>
          </td>
          <td>
            <a th:href="@{/competitions/{id}(id=${j.competitionId})}"
               th:text="${j.competitionName}" class="text-decoration-none"></a>
          </td>
          <td class="fw-medium" th:text="${j.distance}"></td>
          <td th:text="${j.stylePoints}"></td>
          <td th:text="${j.windFactor}"></td>
          <td th:text="${j.attemptNumber}"></td>
          <td class="text-end">
            <form th:action="@{/jumps/{id}/delete(id=${j.jumpId})}" method="post">
              <button class="btn btn-sm btn-outline-danger"
                      onclick="return confirm('Удалить результат?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(jumps)}">
          <td colspan="7" class="text-center text-muted py-4">Результаты не найдены</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
