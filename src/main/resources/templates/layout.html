<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Летающий лыжник">Летающий лыжник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 1rem; }
        .sidebar .nav-link { color: #adb5bd; padding: .5rem 1rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #343a40; border-radius: .375rem; }
        .sidebar .nav-link i { margin-right: .5rem; }
        .sidebar-brand { color: #fff; font-size: 1.1rem; font-weight: 600; padding: 1rem; display: block; text-decoration: none; border-bottom: 1px solid #343a40; margin-bottom: 1rem; }
        .main-content { padding: 2rem; }
        .page-header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #dee2e6; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- sidebar -->
        <nav class="col-md-2 sidebar">
            <a href="/" class="sidebar-brand">
                <i class="bi bi-snow2"></i> Летающий лыжник
            </a>
            <ul class="nav flex-column px-2">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/athletes}">
                        <i class="bi bi-people"></i> Спортсмены
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/coaches}">
                        <i class="bi bi-person-badge"></i> Тренеры
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/competitions}">
                        <i class="bi bi-trophy"></i> Соревнования
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/jumps}">
                        <i class="bi bi-graph-up"></i> Результаты прыжков
                    </a>
                </li>
            </ul>
        </nav>

        <!-- main content -->
        <main class="col-md-10 main-content">

            <!-- success alert -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div layout:fragment="content">
                <!-- templates content -->
            </div>
        </main>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
