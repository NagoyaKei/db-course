<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Летающий лыжник">Летающий лыжник</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {
            }
        })();
    </script>
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
</head>
<body>
<div class="app">

    <aside class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Главное меню">
        <div class="sidebar-inner">
            <a th:href="@{/}" class="sidebar-brand" aria-label="Летающий лыжник, на главную">
                <img th:src="@{/img/logo-128.png}" width="128" height="128" alt="Летающий лыжник">
            </a>

            <nav>
                <ul class="sidebar-nav">
                    <li>
                        <a class="sidebar-link" th:href="@{/}" th:classappend="${currentPath == '/'} ? 'active'">
                            <i class="bi bi-grid-1x2"></i> Главная
                        </a>
                    </li>
                </ul>

                <div class="sidebar-group">Учет</div>
                <ul class="sidebar-nav">
                    <li>
                        <a class="sidebar-link" th:href="@{/athletes}"
                           th:classappend="${currentPath?.startsWith('/athletes')} ? 'active'">
                            <i class="bi bi-people"></i> Спортсмены
                        </a>
                    </li>
                    <li>
                        <a class="sidebar-link" th:href="@{/coaches}"
                           th:classappend="${currentPath?.startsWith('/coaches')} ? 'active'">
                            <i class="bi bi-person-badge"></i> Тренеры
                        </a>
                    </li>
                    <li>
                        <a class="sidebar-link" th:href="@{/competitions}"
                           th:classappend="${currentPath?.startsWith('/competitions')} ? 'active'">
                            <i class="bi bi-trophy"></i> Соревнования
                        </a>
                    </li>
                    <li>
                        <a class="sidebar-link" th:href="@{/jumps}"
                           th:classappend="${currentPath?.startsWith('/jumps')} ? 'active'">
                            <i class="bi bi-graph-up"></i> Результаты прыжков
                        </a>
                    </li>
                </ul>

                <div class="sidebar-group">Аналитика</div>
                <ul class="sidebar-nav">
                    <li>
                        <a class="sidebar-link" th:href="@{/norms}"
                           th:classappend="${currentPath?.startsWith('/norms')} ? 'active'">
                            <i class="bi bi-table"></i> Нормативы
                        </a>
                    </li>
                    <li>
                        <a class="sidebar-link" th:href="@{/analytics}"
                           th:classappend="${currentPath?.startsWith('/analytics')} ? 'active'">
                            <i class="bi bi-graph-up-arrow"></i> Прогнозы
                        </a>
                    </li>
                    <li>
                        <a class="sidebar-link" th:href="@{/records}"
                           th:classappend="${currentPath?.startsWith('/records')} ? 'active'">
                            <i class="bi bi-bar-chart-line"></i> Рекорды
                        </a>
                    </li>
                </ul>

                <div class="sidebar-group">Справочники</div>
                <ul class="sidebar-nav">
                    <li>
                        <a class="sidebar-link" th:href="@{/hills}"
                           th:classappend="${currentPath?.startsWith('/hills')} ? 'active'">
                            <i class="bi bi-triangle"></i> Трамплины
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <span>Курсовой проект по дисциплине "Базы данных". 2026</span>
                <button type="button" class="btn theme-toggle" data-theme-toggle
                        aria-label="Переключить тему" title="Переключить тему">
                    <i class="bi bi-moon-stars"></i>
                </button>
            </div>
        </div>
    </aside>

    <div class="app-main">
        <header class="app-topbar d-lg-none">
            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                    aria-controls="sidebar" aria-label="Открыть меню">
                <i class="bi bi-list"></i>
            </button>
            <a th:href="@{/}" class="brand">
                <img th:src="@{/img/logo-128.png}" width="40" height="40" alt="">
                <span>Летающий лыжник</span>
            </a>
            <button type="button" class="btn theme-toggle ms-auto" data-theme-toggle
                    aria-label="Переключить тему" title="Переключить тему">
                <i class="bi bi-moon-stars"></i>
            </button>
        </header>

        <main class="app-content">
            <div layout:fragment="content">
                <!-- page content -->
            </div>
        </main>
    </div>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
    <div th:if="${success}" class="toast align-items-center" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill text-success toast-icon"></i>
                <span th:text="${success}"></span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
    </div>
    <div th:if="${error}" class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill text-danger toast-icon"></i>
                <span th:text="${error}"></span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h2 class="modal-title h5" id="confirmModalTitle">Подтверждение</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body" data-confirm-message></div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" data-confirm-accept>Подтвердить</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
