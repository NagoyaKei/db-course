<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Ошибка</title></head>
<body>
<div layout:fragment="content">
  <div class="error-page">
    <i class="bi bi-exclamation-triangle"></i>
    <h1 class="h3 mt-3">Что-то пошло не так</h1>
    <p class="text-secondary"
       th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Страница не найдена или произошла ошибка'"></p>
    <p th:if="${status instanceof T(java.lang.Integer)}"><code th:text="${status}"></code></p>
    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house me-1"></i> На главную</a>
  </div>
</div>
</body>
</html>
