<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Рекорд</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3">Фиксация рекорда</h1>
    <p class="text-secondary mb-0">
      <span th:text="${jump.athleteFullName}"></span>,
      <span th:text="${jump.distance}"></span> м,
      <span th:text="${jump.competitionName}"></span>
      (<span th:text="${#temporals.format(jump.jumpTimestamp, 'dd.MM.yyyy')}"></span>)
    </p>
  </div>

  <form th:action="@{/jumps/{id}/record(id=${jump.jumpId})}" th:object="${record}" method="post" class="form-card">

    <div class="card">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6" th:insert="~{fragments/form :: enumField('recordType', 'Тип рекорда', true, ${enums.recordType})}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: dateField('verificationDate', 'Дата подтверждения', true)}"></div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/jumps}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

  <form th:if="${record.recordId != null}" th:action="@{/jumps/{id}/record/delete(id=${jump.jumpId})}" method="post" class="mt-3">
    <button type="submit" class="btn btn-outline-danger" data-confirm="Снять отметку о рекорде?">
      <i class="bi bi-trash me-1"></i> Снять отметку о рекорде
    </button>
  </form>

</div>
</body>
</html>
