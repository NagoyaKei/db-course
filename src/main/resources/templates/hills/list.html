<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Трамплины</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h3">Трамплины</h1>
      <p class="text-muted mb-0">Справочник трамплинов клуба</p>
    </div>
    <a th:href="@{/hills/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Код</th>
          <th>Название</th>
          <th>K-точка</th>
          <th>Очки за метр</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${hills}">
          <td th:text="${h.type}"></td>
          <td th:text="${h.name}" class="fw-medium"></td>
          <td th:text="${h.kpoint}"></td>
          <td th:text="${h.meterValue}"></td>
          <td class="text-end d-flex gap-1 justify-content-end">
            <a th:href="@{/hills/{id}/edit(id=${h.id})}" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-pencil"></i>
            </a>
            <form th:action="@{/hills/{id}/delete(id=${h.id})}" method="post">
              <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить трамплин?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(hills)}">
          <td colspan="5" class="text-center text-muted py-4">Трамплины не найдены</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
