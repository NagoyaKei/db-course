<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Трамплины</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1 class="h3">Трамплины</h1>
      <p class="text-secondary mb-0">Справочник типоразмеров трамплинов</p>
    </div>
    <a th:href="@{/hills/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Добавить
    </a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th>Код</th>
          <th>Название</th>
          <th class="text-end">K-точка, м</th>
          <th class="text-end">Очки за метр</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${hills}">
          <td><code th:text="${h.type}"></code></td>
          <td class="fw-semibold" th:text="${h.name}"></td>
          <td class="num" th:text="${h.kpoint}"></td>
          <td class="num" th:text="${h.meterValue}"></td>
          <td>
            <div class="row-actions">
              <a th:href="@{/hills/{id}/edit(id=${h.id})}" class="btn btn-sm btn-outline-secondary icon-btn"
                 data-bs-toggle="tooltip" data-bs-title="Редактировать" aria-label="Редактировать">
                <i class="bi bi-pencil"></i>
              </a>
              <form th:action="@{/hills/{id}/delete(id=${h.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-danger icon-btn" data-confirm="Удалить трамплин?"
                        data-bs-toggle="tooltip" data-bs-title="Удалить" aria-label="Удалить">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
        <th:block th:if="${#lists.isEmpty(hills)}"><tr th:replace="~{fragments/ui :: emptyRow(5, 'bi-triangle', 'Трамплины не найдены')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
