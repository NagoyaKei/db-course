<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Трамплин</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${hill.id == null} ? 'Новый трамплин' : 'Редактирование трамплина'"></h1>
  </div>

  <div class="card border-0 shadow-sm" style="max-width: 580px;">
    <div class="card-body">
      <form th:action="${hill.id == null} ? @{/hills} : @{/hills/{id}/edit(id=${hill.id})}"
            th:object="${hill}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
          <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Код <span class="text-danger">*</span></label>
            <input th:field="*{type}" type="text" class="form-control" maxlength="20" placeholder="K-90"
                   th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{type}"></div>
          </div>
          <div class="col-md-7">
            <label class="form-label">Название <span class="text-danger">*</span></label>
            <input th:field="*{name}" type="text" class="form-control" maxlength="100"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">K-точка, м <span class="text-danger">*</span></label>
            <input th:field="*{kpoint}" type="number" min="1" class="form-control"
                   th:classappend="${#fields.hasErrors('kpoint')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{kpoint}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Очки за метр <span class="text-danger">*</span></label>
            <input th:field="*{meterValue}" type="number" min="0.01" step="0.01" class="form-control"
                   th:classappend="${#fields.hasErrors('meterValue')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{meterValue}"></div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Сохранить
          </button>
          <a th:href="@{/hills}" class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>


</div>
</body>
</html>
