<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ru">
<head><title>Трамплин</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="h3" th:text="${hill.id == null} ? 'Новый трамплин' : 'Редактирование трамплина'"></h1>
    <p class="text-secondary mb-0">Поля, отмеченные <span class="required">*</span>, обязательны</p>
  </div>

  <form th:action="${hill.id == null} ? @{/hills} : @{/hills/{id}/edit(id=${hill.id})}"
        th:object="${hill}" method="post" class="form-card">

    <div class="card">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-5" th:insert="~{fragments/form :: textField('type', 'Код', true, 'text', 'K-90', null)}"></div>
          <div class="col-md-7" th:insert="~{fragments/form :: textField('name', 'Название', true, 'text', null, null)}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: textField('kpoint', 'K-точка, м', true, 'number', null, null)}"></div>
          <div class="col-md-6" th:insert="~{fragments/form :: textField('meterValue', 'Очки за метр', true, 'number', null, '0.01')}"></div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Сохранить</button>
      <a th:href="@{/hills}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>

</div>
</body>
</html>
