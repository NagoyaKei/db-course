services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=gorbunov
      - POSTGRES_PASSWORD=gorbunov
      - POSTGRES_DB=gorbunov_db
    ports:
      - 5435:5432
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorbunov -d gorbunov_db"]
      interval: 10s
      timeout: 5s
      retries: 5

